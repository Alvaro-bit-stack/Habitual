name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Content checks
        run: node tests/data.check.js

      - name: Backend dependencies
        run: npm ci --prefix backend

      - name: Backend and offline sync tests
        run: |
          npm test --prefix backend
          node --test tests/sync.test.js tests/cloud-integration.test.js

      - name: Engine tests
        run: node tests/engine.test.js

      - name: Community tests
        run: node tests/community.test.js

      - name: Backend tests
        run: node tests/server.test.js

      - name: Build
        run: python3 build.py

      - name: Install Playwright
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Browser tests
        run: python3 tests/e2e.py

      - name: Community arrival test
        run: python3 tests/arrival.e2e.py

      - name: Community filters and sharing test
        run: python3 tests/filters.e2e.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: scratch/qa/
